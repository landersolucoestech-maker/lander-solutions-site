name: CRM Remove Demo Toggle Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/crm-remove-demo-toggle-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove demo checkbox from CRM owner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/crm_complete_browser.js')
          s = p.read_text(encoding='utf-8')
          old_toggle = "function crmFullDemoToggle(){return `<label class=\"crm-full-demo-toggle\"><input type=\"checkbox\" data-action=\"crm-full-toggle-demo\" ${state.crmFullUi?.includeDemo?'checked':''}> Mostrar dados de demonstração</label>`;}\n"
          old_filters = "function crmFullSearchFilters(filters=[]){return `<div class=\"crm-rel-toolbar crm-full-toolbar\"><div class=\"crm-rel-search\"><span>${icon('search',16)}</span><input id=\"crm-full-search\" type=\"search\" placeholder=\"Buscar no CRM\" autocomplete=\"off\"></div>${filters.join('')}${crmFullDemoToggle()}</div>`;}"
          new_filters = "function crmFullSearchFilters(filters=[]){return `<div class=\"crm-rel-toolbar crm-full-toolbar\"><div class=\"crm-rel-search\"><span>${icon('search',16)}</span><input id=\"crm-full-search\" type=\"search\" placeholder=\"Buscar no CRM\" autocomplete=\"off\"></div>${filters.join('')}</div>`;}"
          if old_toggle not in s:
              raise SystemExit('demo toggle function anchor not found')
          if old_filters not in s:
              raise SystemExit('search filters anchor not found')
          s = s.replace(old_toggle, '', 1).replace(old_filters, new_filters, 1)
          if 'Mostrar dados de demonstração' in s:
              raise SystemExit('demo label still present')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit CRM owner change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/crm_complete_browser.js
          git commit -m "fix(crm): remove demo data checkbox"
          git push origin HEAD:dev
