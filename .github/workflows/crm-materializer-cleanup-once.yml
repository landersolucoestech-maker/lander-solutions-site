name: CRM Materializer Cleanup Once

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/crm-materializer-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove materializer fake-user patch dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/crm_complete_module.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('    # Authentication is intentionally disabled. Do not manufacture a current user')
          end=s.index('    # CRM route composition is owned here:',start)
          lines=[
              '    # Authentication is intentionally disabled. The source owner must already avoid',
              '    # manufacturing an identity; materialization verifies that contract instead of patching it.',
              '    fake_current_user = "add(state.crmUserId||state.crmUserName||\'current\',state.crmUserName||\'Administrador\');"',
              '    real_current_user = "const currentId=String(state.crmUserId||\'\').trim(),currentName=String(state.crmUserName||\'\').trim();"',
              '    if fake_current_user in browser:',
              '        raise RuntimeError("CRM completo: owner de origem ainda fabrica usuário atual")',
              '    if real_current_user not in browser:',
              '        raise RuntimeError("CRM completo: owner de origem não possui seleção de identidade real")',
              '',
          ]
          s=s[:start]+'\n'.join(lines)+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Assert source-owned identity contract
        run: |
          grep -q 'owner de origem ainda fabrica usuário atual' scripts/crm_complete_module.py
          grep -q 'owner de origem não possui seleção de identidade real' scripts/crm_complete_module.py
          ! grep -q 'fallback fictício de usuário não encontrado' scripts/crm_complete_module.py
          python -m py_compile scripts/crm_complete_module.py
      - name: Commit materializer cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/crm_complete_module.py
          git commit -m 'fix(crm): stop materializer from patching fake identity fallback'
          git push origin HEAD:dev
