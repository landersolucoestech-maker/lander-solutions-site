name: Apply Business Sidebar Guard

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-business-sidebar-guard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch Business guard
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/patch_business_sidebar_guard.py
      - name: Remove one-shot files and commit
        run: |
          git rm scripts/patch_business_sidebar_guard.py .github/workflows/apply-business-sidebar-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/crm_business.py
          git diff --cached --check
          git commit -m 'Scope Business sidebar guard to canonical markers'
          git push origin HEAD:dev
