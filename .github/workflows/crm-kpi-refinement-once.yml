name: CRM KPI Refinement Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/crm-kpi-refinement-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Refine Contacts and Leads KPI cards only
        run: |
          python - <<'PY'
          from pathlib import Path

          browser_path = Path('scripts/crm_complete_browser.js')
          css_path = Path('scripts/crm_complete_module.css')
          materializer_path = Path('scripts/crm_complete_module.py')

          browser = browser_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          materializer = materializer_path.read_text(encoding='utf-8')

          old_kpis = '''function crmFullKpis(items){return `<div class="crm-full-kpis">${items.map(([label,value])=>`<article><span>${esc(label)}</span><strong>${Number(value)||0}</strong></article>`).join('')}</div>`;}'''
          new_kpis = '''function crmFullKpis(items){return `<div class="crm-full-kpis">${items.map(([label,value])=>`<article><span>${esc(label)}</span><strong>${Number(value)||0}</strong></article>`).join('')}</div>`;}\nfunction crmFullPercent(value,total,maxFractionDigits=1){\n  const numerator=Number(value),denominator=Number(total);\n  if(!Number.isFinite(numerator)||!Number.isFinite(denominator)||denominator<=0||numerator<=0)return '0%';\n  const percent=(numerator/denominator)*100;\n  return `${new Intl.NumberFormat('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:maxFractionDigits}).format(percent)}%`;\n}\nfunction crmFullCreatedWithinDays(value,days=30){\n  const createdAt=new Date(value).getTime(),now=Date.now(),windowMs=Number(days)*24*60*60*1000;\n  return Number.isFinite(createdAt)&&Number.isFinite(windowMs)&&windowMs>=0&&createdAt<=now&&createdAt>=now-windowMs;\n}\nfunction crmFullKpiCards(items){\n  return `<div class="crm-full-kpi-cards">${items.map((item)=>{const value=Number(item?.value);return `<article class="crm-full-kpi-card"><span class="crm-full-kpi-label">${esc(item?.label||'')}</span><strong class="crm-full-kpi-value">${Number.isFinite(value)?value:0}</strong><small class="crm-full-kpi-helper">${esc(item?.helper||'')}</small></article>`;}).join('')}</div>`;\n}'''
          if old_kpis not in browser:
              raise SystemExit('KPI helper anchor not found')
          browser = browser.replace(old_kpis, new_kpis, 1)

          old_contacts_calc = "  const real=service.getContacts({includeDemo:false}),customerPF=real.filter(({person})=>service.hasRole('person',person.id,'customer')).length,withCompany=real.filter(({person})=>service.party.data.personOrganizationRelationships.some((r)=>r.personId===person.id&&r.status!=='inactive')).length;"
          new_contacts_calc = """  const real=service.getContacts({includeDemo:false}),totalContacts=real.length,relationships=Array.isArray(service.party.data.personOrganizationRelationships)?service.party.data.personOrganizationRelationships:[];\n  const withCompany=real.filter(({person})=>relationships.some((relationship)=>relationship.personId===person.id&&relationship.status!=='inactive'&&!!service.party.getEntity('organization',relationship.organizationId))).length;\n  const activeClients=real.filter(({person,context})=>{const status=ValtrenCrmCore.fold(context?.status||'active');return service.hasRole('person',person.id,'customer')&&context?.active!==false&&!['inactive','inativo','archived','arquivado'].includes(status);}).length;\n  const newContacts=real.filter(({context})=>crmFullCreatedWithinDays(context?.createdAt,30)).length;\n  const contactKpis=[\n    {label:'Total de Contatos',value:totalContacts,helper:totalContacts?`+${newContacts} nos últimos 30 dias`:'Nenhum contato cadastrado'},\n    {label:'Com Empresa',value:withCompany,helper:`${crmFullPercent(withCompany,totalContacts)} dos contatos`},\n    {label:'Clientes Ativos',value:activeClients,helper:`${crmFullPercent(activeClients,totalContacts)} dos contatos`},\n    {label:'Novos Contatos',value:newContacts,helper:'Nos últimos 30 dias'},\n  ];"""
          if old_contacts_calc not in browser:
              raise SystemExit('Contacts calculation anchor not found')
          browser = browser.replace(old_contacts_calc, new_contacts_calc, 1)

          old_contacts_return = "  return `${crmFullKpis([['Total de Contatos',real.length],['Com empresa',withCompany],['Clientes PF',customerPF]])}${crmFullSearchFilters(filters)}${crmFullTable('Lista de Contatos','Pessoas e seus vínculos comerciais',['Nome','Empresa','Contato','Papéis','Responsável','Status','Última interação','Ações'],rows,'Nenhum contato encontrado','Cadastre o primeiro contato para começar.')}`;"
          new_contacts_return = "  return `${crmFullKpiCards(contactKpis)}${crmFullSearchFilters(filters)}${crmFullTable('Lista de Contatos','Pessoas e seus vínculos comerciais',['Nome','Empresa','Contato','Papéis','Responsável','Status','Última interação','Ações'],rows,'Nenhum contato encontrado','Cadastre o primeiro contato para começar.')}`;"
          if old_contacts_return not in browser:
              raise SystemExit('Contacts KPI return anchor not found')
          browser = browser.replace(old_contacts_return, new_contacts_return, 1)

          old_leads_calc = "  const service=crmFullService(),includeDemo=!!state.crmFullUi.includeDemo,items=service.getLeads({includeDemo}),real=service.getLeads({includeDemo:false}),qualified=real.filter((x)=>x.stage==='qualified').length,converted=real.filter((x)=>x.stage==='converted').length;"
          new_leads_calc = """  const service=crmFullService(),includeDemo=!!state.crmFullUi.includeDemo,items=service.getLeads({includeDemo}),real=service.getLeads({includeDemo:false}),totalLeads=real.length;\n  const qualifiedLeads=real.filter((lead)=>lead.stage==='qualified').length;\n  const convertedLeads=real.filter((lead)=>lead.stage==='converted').length;\n  const leadsInProgress=real.filter((lead)=>{const status=ValtrenCrmCore.fold(lead.status||'open');return lead.stage!=='converted'&&!['converted','convertido','lost','perdido','archived','arquivado','inactive','inativo'].includes(status);}).length;\n  const newLeads=real.filter((lead)=>crmFullCreatedWithinDays(lead.createdAt,30)).length;\n  const leadKpis=[\n    {label:'Total de Leads',value:totalLeads,helper:totalLeads?`+${newLeads} nos últimos 30 dias`:'Nenhum lead cadastrado'},\n    {label:'Em Andamento',value:leadsInProgress,helper:`${crmFullPercent(leadsInProgress,totalLeads)} do total`},\n    {label:'Qualificados',value:qualifiedLeads,helper:`${crmFullPercent(qualifiedLeads,totalLeads)} do total`},\n    {label:'Convertidos',value:convertedLeads,helper:`${crmFullPercent(convertedLeads,totalLeads)} de conversão`},\n  ];"""
          if old_leads_calc not in browser:
              raise SystemExit('Leads calculation anchor not found')
          browser = browser.replace(old_leads_calc, new_leads_calc, 1)

          old_leads_return = "  return `${crmFullKpis([['Leads',real.length],['Qualificados',qualified],['Convertidos',converted]])}${crmFullSearchFilters(filters)}${crmFullTable('Leads','Pipeline comercial vinculado à identidade canônica',['Lead','Contato','Origem','Responsável','Etapa','Prioridade','Última interação','Ações'],rows,'Nenhum lead encontrado','Cadastre o primeiro lead para iniciar o pipeline.')}`;"
          new_leads_return = "  return `${crmFullKpiCards(leadKpis)}${crmFullSearchFilters(filters)}${crmFullTable('Leads','Pipeline comercial vinculado à identidade canônica',['Lead','Contato','Origem','Responsável','Etapa','Prioridade','Última interação','Ações'],rows,'Nenhum lead encontrado','Cadastre o primeiro lead para iniciar o pipeline.')}`;"
          if old_leads_return not in browser:
              raise SystemExit('Leads KPI return anchor not found')
          browser = browser.replace(old_leads_return, new_leads_return, 1)

          css_marker = ".crm-full-kpis strong{display:block;margin-top:7px;color:#0B1D3A;font:800 22px/1 Raleway,Arial,sans-serif}"
          css_addition = css_marker + "\n.crm-full-kpi-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.crm-full-kpi-card{position:relative;background:#fff;border:1px solid rgba(11,29,58,.09);border-radius:11px;padding:14px 16px;min-width:0}.crm-full-kpi-label{display:block;color:#475569;font:600 11px/1.2 Montserrat,Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em}.crm-full-kpi-value{display:block;margin-top:7px;color:#0B1D3A;font:700 24px/1 Raleway,Arial,sans-serif}.crm-full-kpi-helper{display:block;margin-top:7px;color:#526174;font:500 11px/1.35 Montserrat,Arial,sans-serif;white-space:normal;overflow-wrap:anywhere}"
          if css_marker not in css:
              raise SystemExit('KPI CSS anchor not found')
          css = css.replace(css_marker, css_addition, 1)
          css += "\n@media(max-width:1100px){.crm-full-kpi-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:600px){.crm-full-kpi-cards{grid-template-columns:1fr}}\n"

          old_contact_order = 'CONTACTS_ORDER_OLD = "${crmFullKpis([[\'Total de Contatos\',real.length],[\'Com empresa\',withCompany],[\'Clientes PF\',customerPF]])}${crmFullSearchFilters(filters)}"\nCONTACTS_ORDER_NEW = "${crmFullKpis([[\'Total de Contatos\',real.length],[\'Com empresa\',withCompany],[\'Clientes PF\',customerPF]])}${crmFullTabs(\'contacts\')}${crmFullSearchFilters(filters)}"'
          new_contact_order = 'CONTACTS_ORDER_OLD = "${crmFullKpiCards(contactKpis)}${crmFullSearchFilters(filters)}"\nCONTACTS_ORDER_NEW = "${crmFullKpiCards(contactKpis)}${crmFullTabs(\'contacts\')}${crmFullSearchFilters(filters)}"'
          if old_contact_order not in materializer:
              raise SystemExit('Contacts materializer contract anchor not found')
          materializer = materializer.replace(old_contact_order, new_contact_order, 1)

          old_lead_order = 'LEADS_ORDER_OLD = "${crmFullKpis([[\'Leads\',real.length],[\'Qualificados\',qualified],[\'Convertidos\',converted]])}${crmFullSearchFilters(filters)}"\nLEADS_ORDER_NEW = "${crmFullKpis([[\'Leads\',real.length],[\'Qualificados\',qualified],[\'Convertidos\',converted]])}${crmFullTabs(\'leads\')}${crmFullSearchFilters(filters)}"'
          new_lead_order = 'LEADS_ORDER_OLD = "${crmFullKpiCards(leadKpis)}${crmFullSearchFilters(filters)}"\nLEADS_ORDER_NEW = "${crmFullKpiCards(leadKpis)}${crmFullTabs(\'leads\')}${crmFullSearchFilters(filters)}"'
          if old_lead_order not in materializer:
              raise SystemExit('Leads materializer contract anchor not found')
          materializer = materializer.replace(old_lead_order, new_lead_order, 1)
          materializer = materializer.replace('CACHE_VERSION = "20260827-crm-complete-v5"', 'CACHE_VERSION = "20260827-crm-complete-v6"', 1)

          required_browser = [
              "label:'Total de Contatos'", "label:'Com Empresa'", "label:'Clientes Ativos'", "label:'Novos Contatos'",
              "label:'Total de Leads'", "label:'Em Andamento'", "label:'Qualificados'", "label:'Convertidos'",
              "crmFullPercent(convertedLeads,totalLeads)", "crmFullCreatedWithinDays(context?.createdAt,30)",
          ]
          missing = [token for token in required_browser if token not in browser]
          if missing:
              raise SystemExit(f'Missing KPI implementation tokens: {missing}')
          if "['Clientes PF',customerPF]" in browser:
              raise SystemExit('Legacy Contacts KPI still present')
          if "crmFullKpis([['Leads',real.length]" in browser:
              raise SystemExit('Legacy Leads KPI still present')

          browser_path.write_text(browser, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          materializer_path.write_text(materializer, encoding='utf-8')
          PY

      - name: Validate syntax and materializer contract
        run: |
          node --check scripts/crm_complete_browser.js
          node --check scripts/crm_complete_domain.js
          python scripts/crm_complete_module.py
          node scripts/test_crm_complete.js

      - name: Commit KPI refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/crm_complete_browser.js scripts/crm_complete_module.css scripts/crm_complete_module.py
          git commit -m "feat(crm): refine contacts and leads KPI cards"
          git push origin HEAD:dev
