name: Finish Product Source Dedupe

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  finish:
    if: ${{ !contains(github.event.head_commit.message, '[product-source-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Migrate remaining consumers and remove duplicates
        run: python scripts/finish_product_source_dedupe.py
      - name: Validate canonical owners
        run: |
          python scripts/structure_gate.py
          python -m py_compile scripts/crm_accessibility_ownership_gate.py
          node scripts/test_crm_business_ui.js
          node scripts/test_crm_compliance_ui.js
          node scripts/test_crm_intellectual_property_ui.js
          node scripts/test_crm_corporate_governance_ui.js
          node scripts/test_crm_legal_contracts_ui.js
          node scripts/test_crm_legal_matters_ui.js
      - name: Commit final source dedupe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: finalize canonical web product sources [product-source-finalized]"
          git push origin HEAD:dev
