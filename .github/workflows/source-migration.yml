name: Apply sidebar source migration

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/source-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply source migrations
        run: |
          python scripts/source_migrate_bootstrap_fix.py
          python scripts/source_migrate_part1.py
          python scripts/source_migrate_part2.py
          python scripts/source_migrate_part3.py

      - name: Validate migrated sources
        run: |
          python -m py_compile \
            scripts/crm_sidebar_architecture.py \
            scripts/crm_relationships_module.py \
            scripts/crm_reference_modules.py \
            scripts/crm_canonical_parties.py \
            scripts/crm_global_header.py \
            scripts/crm_definitive_architecture.py \
            scripts/crm_product_system_review.py \
            scripts/crm_product_system_review_runner.py \
            scripts/materialize.py
          node scripts/test_crm_sidebar_architecture.js
          git diff --check

      - name: Commit consolidated source
        run: |
          rm scripts/source_migrate_bootstrap_fix.py scripts/source_migrate_part1.py scripts/source_migrate_part2.py scripts/source_migrate_part3.py
          rm .github/workflows/source-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate sidebar architecture source"
          git push origin HEAD:dev
