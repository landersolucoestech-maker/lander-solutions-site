name: Publish dev to GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Test canonical parties core
        run: node scripts/test_crm_canonical_parties.js

      - name: Test complete CRM domain
        run: |
          node scripts/test_crm_complete.js
          node scripts/test_crm_complete_hardening.js

      - name: Test financial Transactions domain
        run: |
          node --check scripts/crm_financial_transactions_core.js
          node --check scripts/crm_financial_transactions_browser.js
          node scripts/test_crm_financial_transactions.js
          node scripts/test_crm_financial_transactions_ui.js

      - name: Test Accounting domain
        run: |
          node --check scripts/crm_accounting_core.js
          node --check scripts/crm_accounting_browser.js
          node scripts/test_crm_accounting.js
          node scripts/test_crm_accounting_ui.js

      - name: Materialize site
        run: python scripts/materialize.py

      - name: Validate materialized app
        run: |
          node --check app.js
          node scripts/test_crm_canonical_parties.js --materialized
          node scripts/test_crm_complete.js --materialized
          node scripts/test_crm_complete_hardening.js --materialized
          node scripts/test_crm_financial_transactions.js --materialized
          node scripts/test_crm_financial_transactions_ui.js --materialized
          node scripts/test_crm_accounting.js --materialized
          node scripts/test_crm_accounting_ui.js --materialized

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare publish directory
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.bootstrap' \
            --exclude='_site' \
            --exclude='scripts'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
