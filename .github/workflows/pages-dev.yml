name: Publish dev to GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Test canonical parties core
        run: node scripts/test_crm_canonical_parties.js

      - name: Test complete CRM domain
        run: |
          node scripts/test_crm_complete.js
          node scripts/test_crm_complete_hardening.js

      - name: Test financial Transactions domain
        run: |
          node --check scripts/crm_financial_transactions_core.js
          node --check scripts/crm_financial_transactions_browser.js
          node scripts/test_crm_financial_transactions.js
          node scripts/test_crm_financial_transactions_ui.js

      - name: Test Accounting domain
        run: |
          node --check scripts/crm_accounting_core.js
          node --check scripts/crm_accounting_browser.js
          node scripts/test_crm_accounting.js
          node scripts/test_crm_accounting_ui.js

      - name: Test Fiscal Documents domain
        run: |
          node --check scripts/crm_fiscal_documents_core.js
          node --check scripts/crm_fiscal_documents_browser.js
          node scripts/test_crm_fiscal_documents.js
          node scripts/test_crm_fiscal_documents_ui.js

      - name: Test Cost Allocations domain
        run: |
          node --check scripts/crm_cost_allocations_core.js
          node --check scripts/crm_cost_allocations_browser.js
          node scripts/test_crm_cost_allocations.js
          node scripts/test_crm_cost_allocations_ui.js

      - name: Test Legal Contracts domain
        run: |
          node --check scripts/crm_legal_contracts_core.js
          node --check scripts/crm_legal_contracts_browser.js
          node scripts/test_crm_legal_contracts.js
          node scripts/test_crm_legal_contracts_ui.js

      - name: Test Economic Participations domain
        run: |
          node --check scripts/crm_economic_participations_core.js
          node --check scripts/crm_economic_participations_browser.js
          python -m py_compile scripts/crm_economic_participations.py
          node scripts/test_crm_economic_participations.js
          node scripts/test_crm_economic_participations_ui.js

      - name: Test Payouts domain
        run: |
          node --check scripts/crm_payouts_core.js
          node --check scripts/crm_payouts_browser.js
          python -m py_compile scripts/crm_payouts.py
          node scripts/test_crm_payouts.js
          node scripts/test_crm_payouts_ui.js

      - name: Test Business catalog domain
        run: |
          node --check scripts/crm_business_core.js
          node --check scripts/crm_business_browser.js
          python -m py_compile scripts/crm_business.py
          node scripts/test_crm_business.js
          node scripts/test_crm_business_ui.js

      - name: Test Legal Matters domain
        run: |
          node --check scripts/crm_legal_matters_core.js
          node --check scripts/crm_legal_matters_browser.js
          python -m py_compile scripts/crm_legal_materializer_utils.py scripts/crm_legal_matters.py
          node scripts/test_crm_legal_matters.js
          node scripts/test_crm_legal_matters_ui.js

      - name: Test Compliance domain
        run: |
          node --check scripts/crm_compliance_core.js
          node --check scripts/crm_compliance_browser.js
          python -m py_compile scripts/crm_compliance.py
          node scripts/test_crm_compliance.js
          node scripts/test_crm_compliance_ui.js

      - name: Test Intellectual Property domain
        run: |
          node --check scripts/crm_intellectual_property_core.js
          node --check scripts/crm_intellectual_property_browser.js
          python -m py_compile scripts/crm_intellectual_property.py
          node scripts/test_crm_intellectual_property.js
          node scripts/test_crm_intellectual_property_ui.js

      - name: Test Corporate Governance domain
        run: |
          node --check scripts/crm_corporate_governance_core.js
          node --check scripts/crm_corporate_governance_browser.js
          python -m py_compile scripts/crm_corporate_governance.py
          node scripts/test_crm_corporate_governance.js
          node scripts/test_crm_corporate_governance_ui.js

      - name: Materialize site
        run: python scripts/materialize.py

      - name: Verify Business materializer idempotence
        run: |
          BEFORE="$(sha256sum app.js | awk '{print $1}')"
          python scripts/crm_business.py
          AFTER="$(sha256sum app.js | awk '{print $1}')"
          echo "Business idempotence SHA before: $BEFORE"
          echo "Business idempotence SHA after:  $AFTER"
          test "$BEFORE" = "$AFTER"

      - name: Verify remaining Legal materializers idempotence
        run: |
          APP_BEFORE="$(sha256sum app.js | awk '{print $1}')"
          CSS_BEFORE="$(sha256sum assets/valtren-brand.css | awk '{print $1}')"
          INDEX_BEFORE="$(sha256sum index.html | awk '{print $1}')"
          for script in crm_legal_matters.py crm_compliance.py crm_intellectual_property.py crm_corporate_governance.py; do
            python "scripts/$script"
            test "$(sha256sum app.js | awk '{print $1}')" = "$APP_BEFORE"
            test "$(sha256sum assets/valtren-brand.css | awk '{print $1}')" = "$CSS_BEFORE"
            test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_BEFORE"
          done
          echo "Legal materializers idempotence SHA app.js: $APP_BEFORE"

      - name: Verify canonical Business, Legal and Finance routes
        run: |
          grep -Fq "if(path==='/crm/negocios')return crmBusinessProductsPage();" app.js
          grep -Fq "if(path==='/crm/negocios/servicos')return crmBusinessServicesPage();" app.js
          grep -Fq "if(path==='/crm/negocios/unidades')return crmBusinessUnitsPage();" app.js
          grep -Fq "if(path==='/crm/juridico')return crmLegalMattersPage();" app.js
          grep -Fq "if(path==='/crm/juridico/contratos')return crmLegalContractsPage();" app.js
          grep -Fq "if(path==='/crm/juridico/contratos/templates')return crmLegalTemplatesPage();" app.js
          grep -Fq "if(path==='/crm/juridico/contratos/variaveis')return crmLegalVariablesPage();" app.js
          grep -Fq "if(path==='/crm/juridico/compliance')return crmCompliancePage();" app.js
          grep -Fq "if(path==='/crm/juridico/propriedade-intelectual')return crmIntellectualPropertyPage();" app.js
          grep -Fq "if(path==='/crm/juridico/societario')return crmCorporateGovernancePage();" app.js
          grep -Fq "if(path==='/crm/financeiro/participacoes')return crmEconomicParticipationsPage();" app.js
          grep -Fq "if(path==='/crm/financeiro/repasses')return crmPayoutsPage();" app.js
          for route in \
            "if(path==='/crm/juridico')return crmArchitecturePlaceholderPage('legal','matters'" \
            "if(path==='/crm/juridico/compliance')return crmArchitecturePlaceholderPage" \
            "if(path==='/crm/juridico/propriedade-intelectual')return crmArchitecturePlaceholderPage" \
            "if(path==='/crm/juridico/societario')return crmArchitecturePlaceholderPage"; do
            if grep -Fq "$route" app.js; then echo "Placeholder jurídico sobreviveu: $route" >&2; exit 1; fi
          done
          grep -Fq "function crmLegalMattersFeed" app.js
          grep -Fq "function crmComplianceObligationsFeed" app.js
          grep -Fq "function crmIntellectualPropertyFeed" app.js
          grep -Fq "function crmCorporateStructureFeed" app.js
          grep -Fq "corporate_ownership_is_not_economic_participation" app.js
          grep -Fq "function crmContractEconomicRulesFeed(filters={})" app.js
          grep -Fq "function crmParticipationObligationsFeed(filters={})" app.js

      - name: Validate materialized app
        run: |
          node --check app.js
          APP_SHA="$(sha256sum app.js | awk '{print $1}')"
          echo "Materialized app.js SHA-256: $APP_SHA"
          readonly_suite() {
            local script="$1"
            shift
            local before after
            before="$(sha256sum app.js | awk '{print $1}')"
            echo "app.js SHA-256 before $script: $before"
            test "$before" = "$APP_SHA"
            node "$script" "$@"
            after="$(sha256sum app.js | awk '{print $1}')"
            echo "app.js SHA-256 after  $script: $after"
            test "$after" = "$APP_SHA"
          }
          readonly_suite scripts/test_crm_canonical_parties.js --materialized
          readonly_suite scripts/test_crm_complete.js --materialized
          readonly_suite scripts/test_crm_complete_hardening.js --materialized
          readonly_suite scripts/test_crm_financial_transactions.js --materialized
          readonly_suite scripts/test_crm_financial_transactions_ui.js --materialized
          readonly_suite scripts/test_crm_accounting.js --materialized
          readonly_suite scripts/test_crm_accounting_ui.js --materialized
          readonly_suite scripts/test_crm_fiscal_documents.js --materialized
          readonly_suite scripts/test_crm_fiscal_documents_ui.js --materialized
          readonly_suite scripts/test_crm_cost_allocations.js --materialized
          readonly_suite scripts/test_crm_cost_allocations_ui.js --materialized
          readonly_suite scripts/test_crm_legal_contracts.js --materialized
          readonly_suite scripts/test_crm_legal_contracts_ui.js --materialized
          readonly_suite scripts/test_crm_economic_participations.js --materialized
          readonly_suite scripts/test_crm_economic_participations_ui.js --materialized
          readonly_suite scripts/test_crm_payouts.js --materialized
          readonly_suite scripts/test_crm_payouts_ui.js --materialized
          readonly_suite scripts/test_crm_business.js --materialized
          readonly_suite scripts/test_crm_business_ui.js --materialized
          readonly_suite scripts/test_crm_legal_matters.js --materialized
          readonly_suite scripts/test_crm_legal_matters_ui.js --materialized
          readonly_suite scripts/test_crm_compliance.js --materialized
          readonly_suite scripts/test_crm_compliance_ui.js --materialized
          readonly_suite scripts/test_crm_intellectual_property.js --materialized
          readonly_suite scripts/test_crm_intellectual_property_ui.js --materialized
          readonly_suite scripts/test_crm_corporate_governance.js --materialized
          readonly_suite scripts/test_crm_corporate_governance_ui.js --materialized
          FINAL_SHA="$(sha256sum app.js | awk '{print $1}')"
          test "$APP_SHA" = "$FINAL_SHA"
          echo "MATERIALIZED_APP_SHA=$APP_SHA" >> "$GITHUB_ENV"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare publish directory
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.bootstrap' \
            --exclude='_site' \
            --exclude='scripts'
          PUBLISH_APP_SHA="$(sha256sum _site/app.js | awk '{print $1}')"
          test "$MATERIALIZED_APP_SHA" = "$PUBLISH_APP_SHA"
          echo "Publish app.js SHA-256: $PUBLISH_APP_SHA"
          echo "Publish directory size: $(du -sb _site | awk '{print $1}') bytes"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
