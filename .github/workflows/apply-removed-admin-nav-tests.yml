name: Apply Removed Administration Nav Tests

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-removed-admin-nav-tests.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch obsolete navigation tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/patch_removed_admin_nav_tests.py
      - name: Validate updated tests
        run: |
          node --check scripts/test_crm_financial_transactions.js
          node --check scripts/test_crm_business_ui.js
      - name: Remove one-shot files and commit
        run: |
          git rm scripts/patch_removed_admin_nav_tests.py .github/workflows/apply-removed-admin-nav-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test_crm_financial_transactions.js scripts/test_crm_business_ui.js
          git diff --cached --check
          git commit -m 'Align materialized nav tests with removed Administration'
          git push origin HEAD:dev
