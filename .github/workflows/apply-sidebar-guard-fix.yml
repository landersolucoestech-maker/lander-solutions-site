name: Apply Sidebar Guard Fix

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply guard fix
        run: |
          python scripts/apply_sidebar_guard_fix.py
          python -m py_compile scripts/*.py
      - name: Remove temporary files and commit
        run: |
          git rm scripts/apply_sidebar_guard_fix.py .github/workflows/apply-sidebar-guard-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts
          git diff --cached --check
          git commit -m 'Scope domain sidebar guards to canonical navigation block'
          git push origin HEAD:dev
