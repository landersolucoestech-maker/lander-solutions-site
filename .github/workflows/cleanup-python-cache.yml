name: Cleanup Python Cache

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove tracked Python cache artifacts
        run: |
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git rm -r --cached --ignore-unmatch scripts/__pycache__
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/cleanup-python-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove Python cache artifacts from source tree'
          git push origin HEAD:dev
