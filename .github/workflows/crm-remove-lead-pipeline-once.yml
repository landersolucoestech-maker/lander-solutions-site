name: CRM Lead Pipeline Cleanup Once
# trigger

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/crm-remove-lead-pipeline-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove duplicate lower lead pipeline cards
        run: |
          python - <<'PY'
          from pathlib import Path

          browser_path = Path('scripts/crm_complete_browser.js')
          browser = browser_path.read_text(encoding='utf-8')
          pipeline_line = "  const pipeline=`<div class=\"crm-full-pipeline\" aria-label=\"Pipeline de Leads\">${ValtrenCrmCore.STAGES.map((stage)=>`<article><span>${esc(crmFullStageLabel(stage))}</span><strong>${real.filter((x)=>x.stage===stage).length}</strong></article>`).join('')}</div>`;\n"
          if pipeline_line not in browser:
              raise SystemExit('lead pipeline declaration not found')
          browser = browser.replace(pipeline_line, '', 1)
          old_return = "  return `${crmFullKpis([['Leads',real.length],['Qualificados',qualified],['Convertidos',converted]])}${pipeline}${crmFullSearchFilters(filters)}${crmFullTable('Leads','Pipeline comercial vinculado à identidade canônica',['Lead','Contato','Origem','Responsável','Etapa','Prioridade','Última interação','Ações'],rows,'Nenhum lead encontrado','Cadastre o primeiro lead para iniciar o pipeline.')}`;"
          new_return = "  return `${crmFullKpis([['Leads',real.length],['Qualificados',qualified],['Convertidos',converted]])}${crmFullSearchFilters(filters)}${crmFullTable('Leads','Pipeline comercial vinculado à identidade canônica',['Lead','Contato','Origem','Responsável','Etapa','Prioridade','Última interação','Ações'],rows,'Nenhum lead encontrado','Cadastre o primeiro lead para iniciar o pipeline.')}`;"
          if old_return not in browser:
              raise SystemExit('lead view return with pipeline not found')
          browser = browser.replace(old_return, new_return, 1)
          browser_path.write_text(browser, encoding='utf-8')

          module_path = Path('scripts/crm_complete_module.py')
          module = module_path.read_text(encoding='utf-8')
          old_old = '''LEADS_ORDER_OLD = "${crmFullKpis([['Leads',real.length],['Qualificados',qualified],['Convertidos',converted]])}${pipeline}${crmFullSearchFilters(filters)}"'''
          old_new = '''LEADS_ORDER_NEW = "${crmFullKpis([['Leads',real.length],['Qualificados',qualified],['Convertidos',converted]])}${crmFullTabs('leads')}${pipeline}${crmFullSearchFilters(filters)}"'''
          new_old = '''LEADS_ORDER_OLD = "${crmFullKpis([['Leads',real.length],['Qualificados',qualified],['Convertidos',converted]])}${crmFullSearchFilters(filters)}"'''
          new_new = '''LEADS_ORDER_NEW = "${crmFullKpis([['Leads',real.length],['Qualificados',qualified],['Convertidos',converted]])}${crmFullTabs('leads')}${crmFullSearchFilters(filters)}"'''
          if old_old not in module or old_new not in module:
              raise SystemExit('CRM lead materializer pipeline contract not found')
          module = module.replace(old_old, new_old, 1).replace(old_new, new_new, 1)
          module_path.write_text(module, encoding='utf-8')
          PY
      - name: Assert cleanup
        run: |
          ! grep -q 'const pipeline=`<div class="crm-full-pipeline"' scripts/crm_complete_browser.js
          ! grep -q '\${pipeline}' scripts/crm_complete_browser.js
          ! grep -q '\${pipeline}' scripts/crm_complete_module.py
          node --check scripts/crm_complete_browser.js
          python -m py_compile scripts/crm_complete_module.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/crm_complete_browser.js scripts/crm_complete_module.py
          git commit -m 'fix(crm): remove duplicate lead pipeline summary cards'
          git push origin HEAD:dev
