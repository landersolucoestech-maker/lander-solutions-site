name: Apply Sidebar Nested Width

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-sidebar-nested-width.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch nested width
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/patch_sidebar_nested_width.py
      - name: Remove one-shot files and commit
        run: |
          git rm scripts/patch_sidebar_nested_width.py .github/workflows/apply-sidebar-nested-width.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/crm_sidebar_architecture.py
          git diff --cached --check
          git commit -m 'Prevent nested sidebar horizontal overflow'
          git push origin HEAD:dev
