name: Remove Legacy Src Bridge

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  remove:
    if: ${{ !contains(github.event.head_commit.message, '[legacy-src-bridge-removed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/remove_legacy_src_bridge.py
      - run: |
          python -m py_compile scripts/materialize.py
          ! grep -n 'LEGACY_SRC\|_stage_legacy_source_compatibility\|_cleanup_legacy_source_compatibility' scripts/materialize.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove runtime root src bridge [legacy-src-bridge-removed]"
          git push origin HEAD:dev
